[package]
name = "hants"
version = "0.1.2"
edition = "2024"
description = "HANdy ToolSet - A lightweight CLI utility that consolidates several small tools to streamline everyday development tasks."
authors = ["Ivan Nosar"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/ivan-nosar/hants"
homepage = "https://github.com/ivan-nosar/hants"
keywords = ["cli", "toolset", "password", "base64", "utility"]
categories = ["command-line-utilities"]

[package.metadata.wix]
upgrade-guid = "FB083FA5-2E65-4B8E-8114-3C6D24EC07D6"
path-guid = "D2D643AC-522B-435B-A953-56B7257A8459"
license = false
eula = false

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
arboard = "3.6.1"
rand = "0.10.2"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
# Instructions: https://github.com/johnthagen/min-sized-rust
opt-level = 3       # Optimize for execution speed over binary size
lto = "fat"         # Enable Link-Time Optimization to strip dead code
codegen-units = 1   # Maximize size reduction optimizations
panic = "abort"     # Remove stack unwinding logic
strip = true        # Strip debugging symbols

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
